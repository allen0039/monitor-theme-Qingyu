name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag and manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const theme = JSON.parse(readFileSync('theme.json'))
          const pkg = JSON.parse(readFileSync('package.json'))
          const lock = JSON.parse(readFileSync('package-lock.json'))
          if ([pkg.version, lock.version, lock.packages[''].version].some(version => version !== theme.version)) throw new Error('Package, lockfile and manifest versions must match')
          if (process.env.GITHUB_REF_NAME !== `v${theme.version}`) throw new Error('Tag must match theme.json version')
          if (theme.url !== `https://github.com/${process.env.GITHUB_REPOSITORY}`) throw new Error('Set theme.json url to this repository before publishing')
          JS
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-theme-boxpro
          path: |
            theme.tar.gz
            theme.tar.gz.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --verify-tag --title "Emerald Globe Pro · Monitor $GITHUB_REF_NAME" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
